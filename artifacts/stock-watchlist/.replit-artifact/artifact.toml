kind = "web"
previewPath = "/"
title = "Stock Watchlist Supercharger"
version = "1.0.0"
id = "artifacts/stock-watchlist"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25897

[services.development]
run = "pnpm --filter @workspace/stock-watchlist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-watchlist", "run", "build" ]
publicDir = "artifacts/stock-watchlist/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25897"
BASE_PATH = "/"
